services:
  mongodb:
    image: mongo:7.0
    container_name: cratecaddy-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: cratecaddy
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 5s
      timeout: 10s
      retries: 5

volumes:
  mongodb_data:
